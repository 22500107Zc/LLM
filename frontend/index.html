<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      This file is the development entry point only. In production the server
      renders the page from the deployment's own branding (see
      server/utils/boot/MetaGenerator.js), so the business's name appears in
      the tab, the social preview and the PWA manifest. Nothing here names a
      product the customer did not buy.
    -->
    <title>Business AI Operations Platform</title>

    <meta name="title" content="Business AI Operations Platform">
    <meta name="description" content="Private AI operations platform for a single business.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Business AI Operations Platform">
    <meta property="og:description" content="Private AI operations platform for a single business.">

    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="Business AI Operations Platform">
    <meta property="twitter:description" content="Private AI operations platform for a single business.">

    <!-- A private deployment should never be indexed. -->
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root" class="h-screen"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
