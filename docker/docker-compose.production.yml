# Production deployment for the managed Business AI Operations Platform.
#
# ONE BUSINESS = ONE DEDICATED DEPLOYMENT. Every identity below is
# parameterized so a single host can run several customers side by side with
# no shared state and no collisions.
#
# Do not invoke this directly; the operator CLI sets and validates everything:
#
#   ./scripts/operator.sh provision acme --domain acme.yourdomain.com --port 3101
#   ./scripts/operator.sh status acme
#
# Required in the environment when invoked manually:
#   COMPOSE_PROJECT_NAME, CUSTOMER_SLUG, HOST_PORT, ENV_FILE
#
# TLS terminates at a reverse proxy in front of this container (see
# DEPLOYMENT.md); the container itself speaks plain HTTP on loopback only.

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required (use scripts/operator.sh)}

networks:
  # Per-project network: customers never share a bridge.
  platform:
    driver: bridge

services:
  platform:
    # Deliberately no fixed container_name - a fixed name collides the moment a
    # second customer is deployed on the same host. Compose derives a unique
    # name from the project.
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}

    restart: unless-stopped

    labels:
      com.platform.customer: ${CUSTOMER_SLUG:?CUSTOMER_SLUG is required}
      com.platform.domain: ${CUSTOMER_DOMAIN:-unset}

    # --- security -----------------------------------------------------------
    # Upstream's compose grants SYS_ADMIN so Chromium's sandbox can run for web
    # scraping. That capability is close to root on the host, so it is dropped
    # here. Core functionality - documents, RAG, chat, agents, embeds, the API -
    # does not need it. If a customer requires the web-scraping data connector,
    # add a Chrome seccomp profile instead of restoring SYS_ADMIN:
    #   security_opt:
    #     - seccomp=./chrome-seccomp.json
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    user: "${UID:-1000}:${GID:-1000}"

    # --- networking ---------------------------------------------------------
    # Loopback only, on a port unique to this customer. The reverse proxy for
    # this customer's domain is the only way in.
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT is required}:3001"
    networks:
      - platform
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # --- configuration and persistence --------------------------------------
    env_file:
      - ${ENV_FILE:?ENV_FILE is required}
    environment:
      NODE_ENV: production
      STORAGE_DIR: /app/server/storage
      # Set explicitly so the staging directory does not depend on the storage
      # layout, and so this customer's database file is unambiguous.
      COLLECTOR_HOTDIR: /app/collector/hotdir
      DATABASE_URL: file:/app/server/storage/anythingllm.db
    volumes:
      # Compose names these per project, so each customer's data is its own
      # volume and one customer's restore can never reach another's.
      - platform-storage:/app/server/storage
      - platform-hotdir:/app/collector/hotdir
      - platform-outputs:/app/collector/outputs
      # Backups are written here by scripts/backup.sh running on the host.
      - ${BACKUP_PATH:-./backups}:/app/backups

    # --- health and resources ------------------------------------------------
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # Guard rails so one customer's runaway request cannot take down the host,
    # or the other customers on it.
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8G}
        reservations:
          memory: ${MEMORY_RESERVATION:-2G}

volumes:
  platform-storage:
    driver: local
  platform-hotdir:
    driver: local
  platform-outputs:
    driver: local
