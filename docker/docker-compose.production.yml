# Production deployment for the managed Business AI Operations Platform.
#
# One business = one dedicated deployment. This file runs a single isolated
# application container with its own database, documents, vector data and
# configuration on a persistent volume.
#
#   docker compose -f docker/docker-compose.production.yml up -d --build
#
# TLS is expected to terminate at a reverse proxy in front of this container
# (see DEPLOYMENT.md). The container itself speaks plain HTTP on 3001 and is
# bound to localhost so it is never directly reachable from the internet.

name: business-ai-platform

networks:
  platform:
    driver: bridge

services:
  platform:
    container_name: business-ai-platform
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}

    restart: unless-stopped

    # --- security -----------------------------------------------------------
    # Upstream's compose grants SYS_ADMIN so Chromium's sandbox can run for web
    # scraping. That capability is close to root on the host, so it is dropped
    # here. Core functionality - documents, RAG, chat, agents, embeds, the API -
    # does not need it. If a customer requires the web-scraping data connector,
    # add a Chrome seccomp profile instead of restoring SYS_ADMIN:
    #   security_opt:
    #     - seccomp=./chrome-seccomp.json
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    user: "${UID:-1000}:${GID:-1000}"

    # --- networking ---------------------------------------------------------
    # Bound to loopback: the reverse proxy is the only way in.
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - platform
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # --- configuration and persistence --------------------------------------
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_DIR: /app/server/storage
    volumes:
      - platform-storage:/app/server/storage
      - platform-hotdir:/app/collector/hotdir
      - platform-outputs:/app/collector/outputs
      # Backups are written here by scripts/backup.sh running on the host.
      - ./backups:/app/backups

    # --- health and resources ------------------------------------------------
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # Guard rails so one runaway request cannot take down the host. Raise these
    # for a customer with a large corpus.
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

volumes:
  platform-storage:
    driver: local
  platform-hotdir:
    driver: local
  platform-outputs:
    driver: local
